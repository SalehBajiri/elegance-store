<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>متجر تقني</h1>
        <div class="cart-info">
            🛒 السلة: <span id="cart-count">0</span>
        </div>
    </header>

    <main class="container">
        
        <section class="products-grid">
            
            <div class="product-card" data-id="1">
                <div class="product-image">🎧</div>
                <h3 class="product-name">سماعات لاسلكية</h3>
                <p class="product-price">150$</p>
                <button class="add-to-cart-btn">أضف للسلة</button>
            </div>

            <div class="product-card" data-id="2">
                <div class="product-image">⌨️</div>
                <h3 class="product-name">لوحة مفاتيح ميكانيكية</h3>
                <p class="product-price">120$</p>
                <button class="add-to-cart-btn">أضف للسلة</button>
            </div>

            <div class="product-card" data-id="3">
                <div class="product-image">🖱️</div>
                <h3 class="product-name">فأرة ألعاب احترافية</h3>
                <p class="product-price">60$</p>
                <button class="add-to-cart-btn">أضف للسلة</button>
            </div>

        </section>

        <aside class="cart-sidebar">
            <h2>محتويات السلة</h2>
            <ul id="cart-items">
                <li class="empty-msg">السلة فارغة حالياً</li>
            </ul>
            <div class="cart-summary">
                <strong>الإجمالي: <span id="total-price">0</span>$</strong>
            </div>
            <button id="checkout-btn">إتمام الطلب</button>
        </aside>

    </main>

    <script src="script.js"></script>
</body>
</html>
